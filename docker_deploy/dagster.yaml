storage:
  postgres:
    postgres_db:
      username: {"env": "POSTGRES_USERNAME"}
      password: {"env": "POSTGRES_PASSWORD"}
      hostname: {"env": "POSTGRES_HOSTNAME"}
      db_name: {"env": "POSTGRES_DB"}
      port: {"env": "POSTGRES_PORT"}

run_launcher:
  module: dagster._core.launcher
  class: DefaultRunLauncher

run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 10
    # At most one in-flight run per orpheus/serial-job tag value (each job
    # tags itself with its own name -- see orpheus_engine/schedules.py). The
    # skip-if-running schedules already stop scheduled ticks from overlapping,
    # but they can't see manual UI runs; this queues those instead of letting
    # them run over an in-progress sync (deadlocks, corrupted dlt/sling state).
    tag_concurrency_limits:
      - key: "orpheus/serial-job"
        limit: 1
        value:
          applyLimitPerUniqueValue: true

run_monitoring:
  enabled: true
  poll_interval_seconds: 15  # Check every 15 seconds for stalled runs
  start_timeout_seconds: 60  # Mark hung STARTING runs as FAILED within ~1 min
  cancel_timeout_seconds: 60  # Mark hung CANCELING runs as CANCELED within ~1 min
  max_resume_run_attempts: 0  # Run launcher doesn't support resuming, just mark as failed
  # NOTE: per-job dagster/max_runtime tags (see orpheus_engine/schedules.py) rely
  # on run monitoring being enabled here. They terminate hung runs (stuck locks,
  # dead sources) so the skip-if-running schedules can't be starved forever.

# One automatic retry for failed runs. Most scheduled-run failures here are
# transient (source DB port flaps, brief connection exhaustion, API blips);
# a single retry clears them without waiting for the next schedule tick.
# Runs re-execute FROM_FAILURE by default, so successful steps don't repeat.
run_retries:
  enabled: true
  max_retries: 1

# Purge old schedule/sensor tick history. The instance DB reached 163 GB on
# 2026-07-31 partly because nothing was ever purged (see also the
# dagster_storage_janitor_job, which handles old runs + event logs).
retention:
  schedule:
    purge_after_days:
      skipped: 7
      failure: 90
      success: 30
  sensor:
    purge_after_days:
      skipped: 7
      failure: 90
      success: 30

telemetry:
  enabled: false