version: 2

models:
  - name: ysws_spend_programs
    description: >
      YSWS spend program registry: one row per canonical program root HCB org.
      Roots come from Airtable ysws_programs HCB links plus exceptional manual
      entries. Nested Airtable roots roll up to their highest registered HCB
      ancestor through hcb.events.parent_id.
    columns:
      - name: root_event_id
        tests: [unique, not_null]
      - name: root_slug
        tests: [unique, not_null]

  - name: ysws_spend_org_tree
    description: >
      Every HCB org in each program's tree, discovered via hcb.events.parent_id
      recursive descent. Descent stops at other canonical program roots and at
      personal author/reviewer pots. Grain: (root_event_id, event_id).
    columns:
      - name: event_id
        description: "Belongs to exactly one program tree."
        tests: [unique, not_null]

  - name: ysws_spend_ledger
    description: >
      The queryable true-spend ledger: every main-ledger outflow of every
      program-tree org, classified into A/C (true spend), B/D/X (not this
      program's spend), or I (intra-tree, netted). Card-grant subledger rows
      excluded; unspent grant cards count as spend at funding time.
      True spend = SUM(outflow_dollars) WHERE is_true_spend.
      Also carries SYNTHETIC marketing backfill rows (spend_bucket =
      'marketing_backfill', hcb_code = 'BACKFILL-<airtable record id>') built
      from marketing_videos_db_payments for spend that predates the
      ysws-marketing org, plus BACKFILL-OFFSET- rows that net
      already-program-counted payments out of the paying program.
    columns:
      - name: spend_category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'D', 'X', 'I', 'M']
      - name: spend_bucket
        tests: [not_null]
      - name: hcb_url
        description: >
          Clickable link to the transaction's page on hcb.hackclub.com. Real
          rows link to their own transaction; synthetic OFFSET-/BACKFILL- rows
          link to the linked real transaction that generated them, when there
          is one. NULL when nothing resolvable exists (e.g. GRANT- pseudo-codes
          or unlinked backfills).
      - name: initiated_by_name
        description: >
          Who made the payment: the vendor-table sender for Wise / PayPal /
          wire / ACH / check rows (the ledger's mapped user can be a
          bookkeeper, not the sender), the requesting user for disbursements,
          else the cardholder who swiped. The person reimbursed, for
          expense_payout rows. NULL for synthetic rows.
      - name: ach_payment_for
        description: "The 'payment for' note on ACH transfers (superseded by transfer_purpose)."
      - name: transfer_recipient_name
        description: >
          Who an outgoing payment went to (Wise / PayPal / wire / ACH /
          Increase-check recipient; the person reimbursed for expense_payout
          rows). NULL for cards, disbursements, and synthetic rows.
      - name: transfer_recipient_email
        description: "Recipient email, where the rail records one."
      - name: transfer_recipient_country
        description: "Recipient country as ISO alpha-2 (Wise + wires only)."
      - name: transfer_purpose
        description: >
          The human 'payment for' note (report title for expense_payout
          rows). Superset of ach_payment_for.
      - name: transfer_original_amount_cents
        description: >
          For rails sent in a foreign currency (Wise, wires): the amount in
          the send currency. The row's amount_dollars stays the settled USD.
      - name: transfer_original_currency
        description: "Currency code of transfer_original_amount_cents (e.g. GBP)."
      - name: transfer_sent_by_name
        description: "The HCB user who initiated the transfer, per the vendor table."
      - name: transfer_sent_at
        description: "When the transfer was sent/approved, per the vendor table."
      - name: transfer_state
        description: "Vendor-table aasm_state: deposited / settled / sent / in_transit / pending / rejected / failed / reversed."
      - name: reimbursement_report_name
        description: "expense_payout rows: the reimbursement report's title."
      - name: reimbursement_expense_memo
        description: >
          expense_payout rows: the per-expense memo — the human-readable
          label for HCB-710 rows, whose ledger memo is an opaque short code.
      - name: card_last4
        description: "Last 4 digits of the card, for card transactions."
      - name: charge_method
        description: "keyed_in / swipe / chip / contactless / online."
      - name: charge_wallet
        description: "apple_pay / google_pay / samsung_pay, when a wallet was used."
      - name: merchant_country
        description: "Card-network merchant country code (e.g. DE)."
      - name: merchant_category
        description: "Card-network merchant category slug (e.g. computer_software_stores)."
      - name: receipt_count
        description: "Receipts attached to the transaction's HCB page (via hcb_code_enrichment)."
      - name: receipt_marked_no_or_lost
        description: "TRUE when someone marked the receipt lost / never existed on HCB."
      - name: tag_labels
        description: "User-defined HCB tag labels on the transaction, sorted."
      - name: spent_date
        description: >
          When the money actually moved (earliest pending-transaction date:
          card swipe / transfer initiation). transaction_date is the settled
          ledger date.
      - name: settled_after_days
        description: "Days between spent_date and settlement; NULL when unknown."

  - name: ysws_grant_spend
    description: >
      Vendor-level decomposition of every card-grant funding row in
      ysws_spend_ledger (spend_bucket = 'grants'), for showing program spend
      by vendor. allocation_kind = 'spend' rows are the grantee's subledger
      card transactions (merchant + card enrichment) allocated back onto the
      grant's funding month(s), proportionally when a grant was topped up
      across months; 'unspent' rows are each funding row's not-yet-spent
      remainder (incl. money later returned/expired). EXACT: per program x
      accrual_month, SUM(allocated_dollars) equals the grants-bucket outflow
      in ysws_spend_ledger, so vendor rows + unspent replace the grants line
      with every column still tying out. accrual_month is the FUNDING month;
      transaction_date is the underlying transaction's own date.
    columns:
      - name: allocation_kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['spend', 'unspent']
      - name: accrual_month
        tests: [not_null]
      - name: allocated_dollars
        tests: [not_null]
      - name: grant_id
        tests: [not_null]
      - name: is_partial_allocation
        description: >
          TRUE on 'spend' rows whose transaction was split across several
          funding months (grant top-ups); allocated_dollars is then this
          month's share of txn_dollars.
      - name: hcb_url
        description: >
          The underlying transaction's HCB page: the card swipe for 'spend'
          rows, the funding disbursement for 'unspent' rows.

  - name: ysws_spend_by_program
    description: >
      Per-program rollup reconciling gross outflow = true spend (A+C) +
      not-spend (B+D+X) + intra-tree (I), with the legacy stated-spend figure,
      overstatement %, tree balance, and cost per weighted hour.
    columns:
      - name: root_event_id
        tests: [unique, not_null]

  - name: ysws_spend_monthly
    description: >
      Program x month x spend_category time series of outflows for dashboards
      and date-windowed true-spend reporting.

  - name: ysws_author_budget_ledger
    description: >
      Every main-ledger transaction of every personal ysws-budget-* pot, with
      budget_bucket classification. Per-person staff budget spend =
      SUM(outflow_dollars) WHERE is_personal_spend; map slug to person
      downstream.
    columns:
      - name: budget_bucket
        tests: [not_null]
      - name: hcb_url
        description: "Clickable link to the transaction's page on hcb.hackclub.com."
      - name: initiated_by_name
        description: >
          Who initiated the transaction, where HCB records one. NULL for card
          swipes and other rows with no recorded user.
      - name: receipt_count
        description: "Receipts attached to the transaction's HCB page."
      - name: receipt_marked_no_or_lost
        description: "TRUE when someone marked the receipt lost / never existed on HCB."
      - name: tag_labels
        description: "User-defined HCB tag labels on the transaction, sorted."
      - name: spent_date
        description: "When the money actually moved (earliest pending-transaction date)."
      - name: settled_after_days
        description: "Days between spent_date and settlement; NULL when unknown."

  - name: ysws_budget_people
    description: >
      One row per record in the Unified YSWS DB "YSWS Authors" roster, with the
      HCB budget org their hand-typed "HCB Budget Fund" URL resolves to.
      link_status names the gap when it does not resolve (no_budget_link,
      unparseable_budget_link, org_not_found). Excludes the roster's email and
      payout columns.
    columns:
      - name: person_record_id
        tests: [unique, not_null]
      - name: link_status
        tests:
          - not_null
          - accepted_values:
              values: [linked, no_budget_link, unparseable_budget_link, org_not_found]
      - name: grants_attributed_dollars
        description: "Dollar value of grants credited to this person as a reviewer."

  - name: ysws_budget_orgs
    description: >
      The personal YSWS budget pot universe and whose pot each one is. Claims a
      pot by slug (ysws-budget-*), by HCB display name (YSWS - Budget*) or by a
      roster link, so pots renamed out of the slug convention are not dropped.
      is_also_program_root marks pots that ysws_spend_org_tree also treats as a
      program root.
    columns:
      - name: budget_event_id
        tests: [unique, not_null]
      - name: budget_slug
        tests: [unique, not_null]
      - name: matched_by
        tests:
          - not_null
          - accepted_values: { values: [slug, name, airtable] }

  - name: ysws_author_budgets
    description: >
      One row per personal YSWS budget pot: personal spend, transfers back to
      orgs (excluded from personal spend), funding received, balance, and the
      person it belongs to (NULL when the roster link is missing).
    columns:
      - name: budget_event_id
        tests: [unique, not_null]

  - name: marketing_videos_db_payments
    description: >
      One row per record in the "Payments" table of the "Hack Club Videos DB"
      Airtable base (via airtable_raw_all_bases): historical marketing
      payments to video authors that predate the ysws-marketing org. Each
      payment carries its match status against the marketing HCB tree;
      unmatched payments become synthetic BACKFILL- rows in ysws_spend_ledger.
    columns:
      - name: airtable_record_id
        tests: [unique, not_null]

  - name: ysws_other_spend
    description: >
      One row per shared YSWS operating cost shown under Other in the leadership
      dashboard: security bounty chargebacks, approved fulfillment bounty runs,
      HQ server-infrastructure costs (direct HQ card charges from hosting /
      CDN / DNS / dev-infra vendors plus HQ-funded server-bill reimbursements
      paid out through the HCB reimbursement clearinghouse), and OpenAI /
      Anthropic spend from HQ and central non-program YSWS orgs.
    columns:
      - name: source_key
        tests: [unique, not_null]
      - name: cost_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['security_bounty', 'fulfillment_bounty', 'servers', 'ai']
      - name: transaction_date
        tests: [not_null]
      - name: amount_dollars
        tests: [not_null]
      - name: hcb_url
        description: >
          Clickable link to the underlying HCB transaction, for rows whose
          source_reference is an HCB code (security bounties, server charges).
          NULL for fulfillment bounty payout runs.
      - name: initiated_by_name
        description: >
          Who initiated the underlying HCB transaction, where recorded. NULL
          for card charges and payout runs.
      - name: receipt_count
        description: "Receipts attached to the underlying HCB page; NULL for payout runs."
      - name: receipt_marked_no_or_lost
        description: "TRUE when someone marked the receipt lost / never existed on HCB."
      - name: tag_labels
        description: "User-defined HCB tag labels on the underlying transaction."
      - name: spent_date
        description: "When the money actually moved (earliest pending-transaction date)."
      - name: settled_after_days
        description: "Days between spent_date and settlement; NULL when unknown."
