version: 2

sources:
  - name: construct
    schema: construct
    quoting:
      identifier: true
    tables:
      - name: user
        description: "Construct users with Slack ID and trust fields; token columns excluded from the Sling mirror."
        meta: { dagster: { asset_key: ['construct_warehouse_mirror'] } }
      - name: project
        description: "Construct projects with URLs and review/submission status."
        meta: { dagster: { asset_key: ['construct_warehouse_mirror'] } }
      - name: devlog
        description: "Construct devlogs with timeSpent minutes, used for custom daily activity."
        meta: { dagster: { asset_key: ['construct_warehouse_mirror'] } }
      - name: ship
        description: "Construct ship events, used for source freshness and validation."
        meta: { dagster: { asset_key: ['construct_warehouse_mirror'] } }
      - name: legion_review
        description: "Construct Legion review actions, used for freshness and quality checks."
        meta: { dagster: { asset_key: ['construct_warehouse_mirror'] } }
      - name: t1_review
        description: "Construct T1 review actions, used for quality checks."
        meta: { dagster: { asset_key: ['construct_warehouse_mirror'] } }
      - name: t2_review
        description: "Construct T2 review actions, used for quality checks."
        meta: { dagster: { asset_key: ['construct_warehouse_mirror'] } }

  # Moonshot ended Dec 2025 and its Coolify DB is normally stopped, so this is a
  # one-time manual backfill (not a scheduled Sling mirror). To refresh: locate
  # and start the Moonshot Postgres service in Coolify, re-run the one-off
  # pg_dump|psql mirror, then stop it again. Credential tables
  # (VerificationToken/Authenticator/Session) and token columns
  # (User.identityToken, Account OAuth tokens) are excluded from the mirror.
