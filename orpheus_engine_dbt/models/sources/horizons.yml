version: 2

sources:
  - name: horizons
    schema: horizons
    tables:
      - name: users
        description: "Horizons users with hackatime_account linkage."
        meta: { dagster: { asset_key: ['horizons_warehouse_mirror'] } }
      - name: projects
        description: "Horizons projects with now_hackatime_projects array and repo_url."
        meta: { dagster: { asset_key: ['horizons_warehouse_mirror'] } }
      - name: user_sessions
        description: "Horizons app user sessions, used as an app mirror freshness signal."
        meta: { dagster: { asset_key: ['horizons_warehouse_mirror'] } }
      - name: user_daily_activity
        description: "Horizons per-user local-date activity rollup with seconds and qualified flag."
        meta: { dagster: { asset_key: ['horizons_warehouse_mirror'] } }
