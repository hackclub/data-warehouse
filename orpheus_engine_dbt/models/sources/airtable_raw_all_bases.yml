version: 2

sources:
  - name: airtable_raw_all_bases
    schema: airtable_raw_all_bases
    tables:
      - name: records
        description: "Raw Airtable records from all bases (base_id, table_id, record_id, fields JSONB)."
        meta: { dagster: { asset_key: ['airtable_raw_all_bases_sync'] } }

  # High Seas, Arcade, and Juice are ended programs whose Airtable backends are
  # replicated by Fivetran (note the _fivetran_synced column), NOT by a Dagster
  # Sling/dlt mirror — so, like the fivetran_log source above, these have no
  # Dagster `deps`. Only the columns the DAU models read are documented here;
  # _fivetran_synced is the mirror-freshness signal used in summer_2026_metadata.
