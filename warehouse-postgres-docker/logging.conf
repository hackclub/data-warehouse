# Direct database access logging
# Keep log_destination = 'stderr' and logging_collector = off so container
# stderr is captured by Docker and shipped to the central log store,
# while remaining readable locally via `docker logs`.
log_destination = 'stderr'
logging_collector = off
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %quser=%u db=%d app=%a client=%r '
