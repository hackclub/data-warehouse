[project]
name = "dashbored"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "flask-session>=0.8",
    "authlib>=1.4",
    "requests>=2.32",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "libcst>=1.5",
    "markupsafe>=3.0",
    "gunicorn>=23.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
